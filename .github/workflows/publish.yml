name: Publish image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/ultimatesoftwares/terminals

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout (without LFS to save LFS bandwidth)
        uses: actions/checkout@v4
        with:
          lfs: false

      # The vendored deb is an LFS pointer in a non-LFS checkout.
      # Fetch the real file from WineHQ instead of spending LFS quota.
      - name: Fetch vendored wine-staging deb
        run: |
          DEB="vendor/wine-staging_11.22~stonking-1_amd64.deb"
          if head -c 200 "$DEB" | grep -q "git-lfs"; then
            wget --tries=5 --timeout=120 -O "$DEB" \
              "https://dl.winehq.org/wine-builds/ubuntu/pool/main/w/wine-staging/wine-staging_11.22~stonking-1_amd64.deb"
          fi
          ls -lh "$DEB"

      # The image is large (Wine + prefix + MT4/MT5); reclaim runner disk.
      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeQL /usr/share/dotnet
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
